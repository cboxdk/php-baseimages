# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  Cbox Init Configuration                                                   ║
# ║  Process Manager for PHP Docker Containers                                ║
# ║  https://github.com/cboxdk/init                                    ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

version: "1.0"

global:
  # Shutdown timeout for graceful process termination
  shutdown_timeout: 30

  # Logging configuration
  log_level: info
  log_format: json

  # Management API (disabled by default for security)
  # Since cbox-init 3.0 the TCP listener binds loopback-only by default; a
  # Unix socket at /var/run/cbox-init.sock is also served. To reach the API
  # from outside the container, set api_host: 0.0.0.0 (or the
  # CBOX_INIT_API_HOST env var) AND set api_auth.
  api_enabled: false
  api_host: 127.0.0.1
  api_port: 9180
  api_auth: ""

  # Prometheus Metrics (enabled by default, localhost only for security)
  metrics_enabled: true
  metrics_port: 9090
  metrics_path: /metrics

  # Runtime PHP-FPM autotuning (embedded cboxdk/fpm-tune, cbox-init 3.1+).
  # Measures live per-worker memory (PSS) and resizes the pool via an atomic
  # drop-in + graceful SIGUSR2 reload (never a restart). The boot-time profile
  # (PHP_FPM_AUTOTUNE_PROFILE) seeds pm.max_children; this loop refines it as
  # real traffic arrives. Off by default — enable with CBOX_FPM_TUNE=true
  # (or CBOX_INIT_FPM_TUNE_ENABLED=true).
  fpm_tune:
    enabled: false
    mode: apply          # apply = write drop-ins + reload; advisory = recommend only
    interval: 30s
    metrics_addr: ""     # e.g. ":9110" to expose fpm_tune_* Prometheus metrics

  # Restart configuration with exponential backoff
  restart_backoff_initial: 1s
  restart_backoff_max: 60s
  max_restart_attempts: 5

  # Readiness: cbox-init is the supervisor, so it is the source of truth for
  # "are we ready". It writes /tmp/cbox-ready once ALL tracked processes are
  # healthy (nginx + php-fpm + any enabled workers) and removes it if any goes
  # unhealthy. Kubernetes should probe THIS, not an nginx path:
  #   readinessProbe: { exec: { command: ["test", "-f", "/tmp/cbox-ready"] } }
  # This is why nginx no longer serves an app-facing /health — the app owns it.
  readiness:
    enabled: true
    path: /tmp/cbox-ready
    mode: all_healthy
    http_port: 9091

# ═══════════════════════════════════════════════════════════════════════════
# Process Definitions (DAG-based dependencies)
# ═══════════════════════════════════════════════════════════════════════════
processes:
  # ─────────────────────────────────────────────────────────────────────────
  # PHP-FPM - Core PHP process handler
  # ─────────────────────────────────────────────────────────────────────────
  php-fpm:
    enabled: true
    command: ["php-fpm", "-F", "-R"]
    type: longrun
    restart: always
    scale: 1
    stdout: true
    stderr: true
    health_check:
      type: tcp
      address: "127.0.0.1:9000"
      period: 5
      timeout: 3
      failure_threshold: 3
    logging:
      files:
        laravel-log:
          path: /var/www/html/storage/logs/laravel.log
          json: { enabled: true, detect_auto: true }
          rotate:
            max_size: 50MB
            max_files: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx - Web server (depends on PHP-FPM being ready)
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    enabled: true
    command: ["nginx", "-g", "daemon off;"]
    type: longrun
    restart: always
    scale: 1
    depends_on:
      - php-fpm
    stdout: true
    stderr: true
    health_check:
      # Internal, localhost-only infra path (NOT the app's /health).
      type: http
      url: "http://127.0.0.1:80/healthz"
      period: 5
      timeout: 3
      failure_threshold: 3
      expected_status: 200

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel Horizon - Queue Manager
  # Enable via CBOX_INIT_PROCESS_HORIZON_ENABLED=true or LARAVEL_HORIZON=true
  # ─────────────────────────────────────────────────────────────────────────
  horizon:
    enabled: false
    command: ["php", "artisan", "horizon"]
    type: longrun
    restart: always
    scale: 1
    working_dir: /var/www/html
    stdout: true
    stderr: true
    shutdown:
      pre_stop_hook:
        command: ["php", "artisan", "horizon:terminate"]
        timeout: 60

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel Reverb - WebSocket Server
  # Enable via CBOX_INIT_PROCESS_REVERB_ENABLED=true or LARAVEL_REVERB=true
  # ─────────────────────────────────────────────────────────────────────────
  reverb:
    enabled: false
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    type: longrun
    restart: always
    scale: 1
    working_dir: /var/www/html
    stdout: true
    stderr: true

  # ─────────────────────────────────────────────────────────────────────────
  # Queue Workers - Default Queue
  # Enable via CBOX_INIT_PROCESS_QUEUE_DEFAULT_ENABLED=true or LARAVEL_QUEUE=true
  # ─────────────────────────────────────────────────────────────────────────
  queue-default:
    enabled: false
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3"]
    type: longrun
    restart: always
    scale: 2
    working_dir: /var/www/html
    stdout: true
    stderr: true

  # ─────────────────────────────────────────────────────────────────────────
  # Queue Workers - High Priority Queue
  # Enable via CBOX_INIT_PROCESS_QUEUE_HIGH_ENABLED=true or LARAVEL_QUEUE_HIGH=true
  # ─────────────────────────────────────────────────────────────────────────
  queue-high:
    enabled: false
    command: ["php", "artisan", "queue:work", "redis", "--queue=high", "--tries=3"]
    type: longrun
    restart: always
    scale: 1
    working_dir: /var/www/html
    stdout: true
    stderr: true

  # ─────────────────────────────────────────────────────────────────────────
  # Laravel Scheduler
  # Enable via CBOX_INIT_PROCESS_SCHEDULER_ENABLED=true or LARAVEL_SCHEDULER=true
  # ─────────────────────────────────────────────────────────────────────────
  scheduler:
    enabled: false
    command: ["php", "artisan", "schedule:work"]
    type: longrun
    restart: always
    scale: 1
    working_dir: /var/www/html
    stdout: true
    stderr: true

  # ─────────────────────────────────────────────────────────────────────────
  # Queue Autoscaler (cboxdk/laravel-queue-autoscale)
  # Enable via CBOX_INIT_PROCESS_AUTOSCALER_ENABLED=true or CBOX_QUEUE_AUTOSCALER=true
  # NOTE: When using autoscaler, disable queue-default/queue-high —
  #       the autoscaler spawns its own workers via Symfony Process.
  # ─────────────────────────────────────────────────────────────────────────
  autoscaler:
    enabled: false
    command: ["php", "artisan", "queue:autoscale"]
    type: longrun
    restart: always
    scale: 1
    working_dir: /var/www/html
    stdout: true
    stderr: true
