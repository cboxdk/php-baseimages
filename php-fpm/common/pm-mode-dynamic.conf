; Default process-manager drop-in (PHP_FPM_PM=dynamic), BAKED into the image
; so a read-only filesystem boots without the entrypoint writing anything:
; the values expand from environment at FPM start, and the entrypoint always
; exports their defaults. For other pm modes the entrypoint rewrites this
; file - and refuses to boot if it cannot honor an explicit non-dynamic
; PHP_FPM_PM, because silently running the wrong process manager is worse.
[www]
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.max_spawn_rate = ${PHP_FPM_MAX_SPAWN_RATE}
