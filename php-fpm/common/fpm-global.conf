; php-fpm [global] overrides. These are master-process settings and MUST live in
; a [global] section — they are rejected inside a [www] pool file. This file is
; included by php-fpm.conf alongside the pool files.
[global]

; Graceful shutdown: on SIGTERM/SIGQUIT (k8s pod termination) wait up to this
; long for in-flight requests to finish before killing workers. The php-fpm
; default is 0, which severs requests immediately — bad for zero-downtime rollouts.
process_control_timeout = 10s

; The settings below were inherited from the official image's docker.conf /
; zz-docker.conf, which we delete at build time to own the config-load order
; outright (docker-library/php#1635 moved directives between those files in
; patch releases). They must live here instead.

; Master runs in the foreground (we also pass -F, this is belt and braces).
daemonize = no

; php-fpm closes STDOUT on startup (bugs.php.net #73886), so the master log
; goes to fd 2 where the container runtime picks it up.
error_log = /proc/self/fd/2

; Allow long log lines (stack traces) without truncation.
; https://github.com/docker-library/php/pull/725#issuecomment-443540114
log_limit = 8192
