; The read-only kernel statistics, allowed — and the secrets, not.
;
; SORTED BEFORE `zz-custom.conf` ON PURPOSE, and that is the entire mechanism.
; PHP-FPM takes the FIRST definition of a `php_admin_value`, not the last.
; cbox-init's own generated pool says the opposite in a comment —
;
;     "Override for those setups by setting the PHP_OPEN_BASEDIR env var
;      (it loads after this pool and wins)"
;
; — and it does not win. Measured: with `PHP_OPEN_BASEDIR` set, the generated
; `zz-env-overrides.conf` carries the value, `zz-custom.conf` carries the narrow
; default, and `ini_get('open_basedir')` in a request returns the narrow one.
; The variable has never done anything for this directive. A file that sorts
; first does.
;
; WHY IT NEEDS TO: `cboxdk/system-metrics`, which `cboxdk/laravel-telemetry`
; reads CPU, memory, load and cgroup limits through, was refused every file it
; needs under FPM. The collector degrades to empty, so telemetry reported a
; healthy application with no metrics rather than an error anybody would notice.
; The CLI has no open_basedir, so a scheduler or queue worker collected fine —
; which is exactly why nobody noticed.
;
; A LIST, NOT `/proc`. `/proc/1/environ` is deliberately absent: PID 1's
; environment is every secret the container holds, and a file-read primitive in
; an application that could reach it would have the database password.
; `/proc/self/environ` and `/proc/*/cmdline` are absent for the same reason.
; system-metrics probes `/proc/1/environ` for container detection and degrades
; cleanly without it.
;
; DELETE THIS FILE once cbox-init stops writing open_basedir into zz-custom.conf,
; or writes it last. Two places defining one directive is one too many, and this
; is the one that can be removed.
[www]
php_admin_value[open_basedir] = /var/www/html:/tmp:/var/tmp:/proc/stat:/proc/loadavg:/proc/meminfo:/proc/uptime:/proc/cpuinfo:/proc/diskstats:/proc/mounts:/proc/net/:/proc/self/cgroup:/sys/fs/cgroup:/sys/class/dmi/id/
