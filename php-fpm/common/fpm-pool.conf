; =============================================================================
;  Cbox Base Image - PHP-FPM Pool Configuration
;  Production-ready with security hardening
; =============================================================================

[www]
; Pool Configuration
user = www-data
group = www-data

; Listen Configuration
; PHP_FPM_LISTEN_ADDR is exported by the entrypoint: "9000" (default, TCP)
; or a unix socket path when PHP_FPM_LISTEN=unix. Both transports are
; first-class - TCP for sidecar/scrape-from-outside setups, the socket for
; single-container throughput (measured ~+25% on the PHP hop).
listen = ${PHP_FPM_LISTEN_ADDR}
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Accept backlog - raise for very high-rps pools (kernel somaxconn caps it)
listen.backlog = ${PHP_FPM_LISTEN_BACKLOG}

; -----------------------------------------------------------------------------
; Process Manager Configuration
; -----------------------------------------------------------------------------
; Worker sizing is auto-tuned by cbox-init from the container's memory/CPU
; limits and exported as PHP_FPM_* env vars, which php-fpm expands below.
; The entrypoint sets safe fallbacks so these always resolve even when
; autotuning is disabled (PHP_FPM_AUTOTUNE_PROFILE="").
;
; PHP_FPM_PM selects the process manager: dynamic (default, warm floor),
; ondemand (workers spawn per burst and idle ones die - bursty/low-traffic
; pods), static (fixed pool). Mode-specific directives (dynamic's spare
; servers, ondemand's idle timeout) live in zz-pm-mode.conf, written by the
; entrypoint, so no mode ever boots with another mode's directives.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}


; Status Page (localhost only - use with nginx restriction)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
slowlog = /proc/self/fd/2
request_slowlog_timeout = ${PHP_FPM_REQUEST_SLOWLOG_TIMEOUT}

; Catch Workers Output
catch_workers_output = yes
decorate_workers_output = no

; -----------------------------------------------------------------------------
; Timeouts
; -----------------------------------------------------------------------------
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}
; NOTE: graceful-shutdown drain is process_control_timeout, but that is a
; php-fpm [global] directive and cannot live in this [www] pool file. It must
; be set in php-fpm.conf's [global] section instead — deferred (see
; docs/AUDIT-2026-07.md). cbox-init v2.2.0 hardened process-lifecycle handling
; covers supervisor-level graceful stop in the meantime.

; -----------------------------------------------------------------------------
; SECURITY: Environment Variable Handling
; -----------------------------------------------------------------------------
; IMPORTANT: clear_env = no allows container env vars to pass to PHP
; This is the recommended approach for containerized applications
clear_env = no

; -----------------------------------------------------------------------------
; PHP Admin Values (cannot be overridden by application code)
; -----------------------------------------------------------------------------
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Upload/POST limits (must match nginx client_max_body_size)
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M
php_admin_value[max_file_uploads] = 20

; Memory limits - pool-level (admin) value, so FPM workers are pinned here
; regardless of php.ini. Env-driven: PHP_FPM_MEMORY_LIMIT (default 256M).
; This deliberately does NOT touch CLI (composer/artisan read php.ini).
php_admin_value[memory_limit] = ${PHP_FPM_MEMORY_LIMIT}

; Execution time limits
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60

; Security: Disable dangerous functions in FPM context
php_admin_value[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals

; open_basedir is NOT set here, deliberately, and this is the second attempt at
; that sentence being true.
;
; It used to be set here with a comment saying an override "loads after this pool
; and wins". PHP-FPM takes the FIRST definition of a `php_admin_value`, not the
; last — so the line that used to be here won every time and `PHP_OPEN_BASEDIR` did nothing for
; anybody who set it, including whoever hit "open_basedir restriction in effect"
; on a symlink-release deploy and followed that comment.
;
; ONE DEFINITION NOW. The entrypoint writes `zz-env-overrides.conf` from
; `PHP_OPEN_BASEDIR`, which the image always sets — so the default is right and
; setting the variable actually changes it.
