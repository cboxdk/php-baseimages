name: Check Dependency Updates

on:
  schedule:
    # Every Monday at 00:00 UTC (before weekly security rebuilds at 01:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Run EOL check
        id: eol
        run: |
          chmod +x scripts/check-eol.sh

          # Run EOL check and capture output
          ./scripts/check-eol.sh 2>&1 | tee ${RUNNER_TEMP}/eol-output.txt || true
          EOL_EXIT=$?

          # Store results
          echo "eol_exit_code=$EOL_EXIT" >> $GITHUB_OUTPUT

          # Extract warnings for annotations
          if [[ $EOL_EXIT -ge 1 ]]; then
            echo "has_eol_warnings=true" >> $GITHUB_OUTPUT
            # Create GitHub warning annotations
            grep -E "CRITICAL|WARNING" ${RUNNER_TEMP}/eol-output.txt | while read -r line; do
              echo "::warning::$line"
            done
          else
            echo "has_eol_warnings=false" >> $GITHUB_OUTPUT
          fi

      - name: Run version update script
        id: update
        run: |
          chmod +x scripts/update-versions.sh

          # Capture output for PR body
          ./scripts/update-versions.sh 2>&1 | tee ${RUNNER_TEMP}/update-output.txt || true

          # Apply updates
          ./scripts/update-versions.sh --apply 2>&1 || true

          # Check if versions.json changed
          if git diff --quiet versions.json; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for new PHP minor version
        run: |
          for version in 8.5 9.0; do
            if curl -sf "https://www.php.net/releases/index.php?json&version=$version" > /dev/null 2>&1; then
              PHP_NEW=$(curl -s "https://www.php.net/releases/index.php?json&version=$version" | jq -r '.version // empty')
              if [ -n "$PHP_NEW" ] && ! jq -e ".php.supported | index(\"$version\")" versions.json > /dev/null; then
                echo "::warning::NEW PHP $version released: $PHP_NEW - Consider adding support!"
              fi
            fi
          done

      - name: Create Version Updates PR
        if: steps.update.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: versions.json
          commit-message: "chore(deps): update versions.json with latest releases"
          title: "chore(deps): Weekly dependency updates"
          body: |
            ## Automated Version Updates

            This PR was automatically created by the weekly version check workflow.

            ### Updates Applied

            ```
            ${{ steps.update.outputs.updates || 'See workflow logs for details' }}
            ```

            ### Sources Checked

            - **PHP Extensions**: PECL (stable releases only)
            - **Swoole/OpenSwoole**: GitHub releases
            - **FrankenPHP**: GitHub releases
            - **Cbox Init**: GitHub releases
            - **PHP Versions**: php.net official releases
            - **Node.js**: nodejs.org LTS releases

            ### Review Checklist

            - [ ] Check for breaking changes in major version updates
            - [ ] Verify extension compatibility with PHP versions
            - [ ] Review release notes for security updates
            - [ ] CI tests pass

            ---

            *Generated by [check-updates.yml](.github/workflows/check-updates.yml) using [update-versions.sh](scripts/update-versions.sh)*
          branch: deps/version-updates
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Create EOL Warning Issue
        if: steps.eol.outputs.eol_exit_code == '2'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "🚨 CRITICAL: Components past EOL require removal"
          content-filepath: ${{ runner.temp }}/eol-output.txt
          labels: |
            critical
            deprecation
            automated

      - name: Summary
        run: |
          echo "## Dependency & EOL Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### EOL Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${RUNNER_TEMP}/eol-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Version Updates" >> $GITHUB_STEP_SUMMARY
          if [ -f ${RUNNER_TEMP}/update-output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ${RUNNER_TEMP}/update-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No updates found" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # GO-BINARY CVE WATCH - the pinned cbox-init / fpm-exporter binaries carry a
  # Go runtime and dependency tree that ages independently of apt. The image
  # Trivy gate already scans gobinary targets and would BLOCK the weekly
  # rebuild reactively; this job gives lead time instead, so the binary gets
  # rebuilt upstream before the gate trips (webdevops shipped stdlib CVEs in
  # every image for 21 months this way - webdevops/Dockerfile#528/#573).
  # ═══════════════════════════════════════════════════════════════════════════
  scan-go-binaries:
    name: Go-binary CVE watch (cbox-init, fpm-exporter)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download pinned binaries
        run: |
          chmod +x scripts/download-cbox-init.sh scripts/download-fpm-exporter.sh
          ./scripts/download-cbox-init.sh
          ./scripts/download-fpm-exporter.sh
          mkdir -p ${RUNNER_TEMP}/go-binaries
          cp cbox-init/binaries/cbox-init-linux-* ${RUNNER_TEMP}/go-binaries/
          cp fpm-exporter/binaries/* ${RUNNER_TEMP}/go-binaries/ 2>/dev/null || true

      - name: Scan binaries for fixable CRITICAL/HIGH CVEs
        id: goscan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/go-binaries
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Alert (open or update the tracking issue)
        if: steps.goscan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Go CVE watch: pinned cbox-init/fpm-exporter binaries carry fixable CRITICAL/HIGH CVEs"
          BODY="The weekly Go-binary scan found fixable CRITICAL/HIGH vulnerabilities in the pinned runtime binaries (see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          Action: rebuild the affected binary upstream (cboxdk/init or cboxdk/fpm-exporter) against a current Go toolchain, cut a release, and bump the pin in versions.json. The image Trivy gate will BLOCK the next weekly rebuild until this is done."
          existing=$(gh issue list --state open --search "in:title Go CVE watch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing as of $(date -u +%F). $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label security
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # SUITE WATCH - upstream drops Debian suites in UNANNOUNCED patch releases
  # (bullseye vanished mid-LTS, docker-library/php#1596/#1619). This alerts the
  # week bookworm stops receiving patches, instead of the week our builds freeze.
  # ═══════════════════════════════════════════════════════════════════════════
  suite-staleness:
    name: Bookworm suite watch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check bookworm still receives upstream patches
        id: suite
        continue-on-error: true
        run: |
          chmod +x scripts/check-suite-alive.sh
          ./scripts/check-suite-alive.sh

      - name: Alert (open or update the tracking issue)
        if: steps.suite.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Upstream suite watch: bookworm variants look dropped or lagging"
          existing=$(gh issue list --state open --search "in:title suite watch" --json number --jq '.[0].number // empty')
          BODY="php:<latest_patch>-fpm-bookworm is missing upstream while the same patch exists on the next suite. Precedent says the suite was dropped in a patch release with zero notice (docker-library/php#1619). Plan the trixie migration: flip ALL layers in one release (multi-stage COPY requires identical suites), and benchmark bookworm vs trixie first (docker-library/php#1431 was a 30-40% CPU regression at the previous suite jump). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still true as of $(date -u +%F). $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
