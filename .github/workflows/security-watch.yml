name: Published image CVE/KEV watch
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
concurrency:
  group: published-image-security-watch
  cancel-in-progress: false
permissions:
  contents: read
  packages: read
  actions: write
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRIVY_CACHE_DIR: .build/trivy-db
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.6, post-remediation
        with:
          version: v0.76.2
          cache: true
      - name: Resolve immutable platform images
        id: images
        run: python3 scripts/security-watch.py plan --repository "$GITHUB_REPOSITORY" --output .build/security-plan.json >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: inventory-cache
        with:
          path: .build/security-sboms
          key: security-sboms-trivy-0.76.2-v1-${{ steps.images.outputs.key }}
          restore-keys: security-sboms-trivy-0.76.2-v1-
          # Inventories are immutable per digest; never cache vulnerability results.
      - name: Six-hour database cache bucket
        id: db
        run: echo "bucket=$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: db-cache
        with:
          path: .build/trivy-db
          key: security-db-${{ steps.db.outputs.bucket }}
          restore-keys: security-db-
      - name: Fetch CISA Known Exploited Vulnerabilities catalog
        run: |
          # CISA first, its GitHub mirror second. load_kev() rejects a truncated
          # catalog, so a failed download fails the watch instead of passing it.
          for url in https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json \
                     https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json; do
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "$url" -o .build/kev.json && break
          done
          jq -r '"KEV catalog \(.catalogVersion): \(.count) entries"' .build/kev.json
      - name: Scan current CVE database and request mitigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security-watch.py scan --plan .build/security-plan.json --cache .build/security-sboms --output .build/security-results --kev .build/kev.json --dispatch
      - uses: actions/cache/save@v6
        if: always() && steps.images.outcome == 'success' && steps.inventory-cache.outputs.cache-hit != 'true'
        with:
          path: .build/security-sboms
          key: security-sboms-trivy-0.76.2-v1-${{ steps.images.outputs.key }}
      - uses: actions/cache/save@v6
        if: always() && steps.db.outcome == 'success' && steps.db-cache.outputs.cache-hit != 'true'
        with:
          path: .build/trivy-db
          key: security-db-${{ steps.db.outputs.bucket }}
      - name: Keep scan evidence even when mitigation is needed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-image-security
          path: .build/security-results/
          retention-days: 7
