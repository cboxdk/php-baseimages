          docker run --rm $IMAGE cbox-init --version

  # ═══════════════════════════════════════════════════════════════════════════
  # CHROMIUM TIER - + Chromium for Browsershot/Dusk/Puppeteer (Alpine only)
  # ═══════════════════════════════════════════════════════════════════════════
  build-chromium-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.2', '8.3', '8.4', '8.5']
        os_variant: ['bookworm']

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Get build lifecycle state
        id: lifecycle
        run: |
          chmod +x ./scripts/get-build-state.sh
          BUILD_STATE=$(./scripts/get-build-state.sh ${{ matrix.php_version }} ${{ matrix.os_variant }})
          echo "LIFECYCLE=$(echo "$BUILD_STATE" | jq -r '.lifecycle')" >> $GITHUB_OUTPUT
          echo "Build state for PHP ${{ matrix.php_version }} ${{ matrix.os_variant }} (chromium):"
          echo "$BUILD_STATE" | jq .

