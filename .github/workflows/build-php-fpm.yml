        id: dockerfile
        run: |
          echo "path=./php-fpm/${{ matrix.php_version }}/debian/bookworm/Dockerfile" >> $GITHUB_OUTPUT
          echo "base_os=bookworm" >> $GITHUB_OUTPUT

