name: Build PHP 8.6 Beta Lane (experimental)
run-name: Build PHP 8.6 preview

# The pre-GA early-warning lane (issue #23): builds all four tiers against
# php:8.6-rc with the pecl-free PIE install path, weekly and on demand.
# Blocked extensions are ATTEMPTED tolerantly - the per-tier report in the
# job summary shows exactly what compiles on 8.6 this week, and flips to OK
# the week upstream tags a fix. A red run means upstream moved under us.
# NOT part of the release chains; pushes only clearly-marked beta tags.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'php-base/Dockerfile.php86-beta'
      - 'php-source/**'
      - 'scripts/php-source.py'
      - '.github/workflows/build-php86-beta.yml'

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: php86-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fpm]
        tier: [slim, standard, chromium, dev]
        include:
          - tier: slim
            tag_suffix: '-slim-beta'
          - tier: standard
            tag_suffix: '-beta'
          - tier: chromium
            tag_suffix: '-chromium-beta'
          - tier: dev
            tag_suffix: '-dev-beta'
    name: ${{ matrix.variant }} / ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Render the locked source build
        run: |
          python3 scripts/php-source.py --series 8.6 render "php86-${{ matrix.variant }}" --output .build/php-source/preview.Dockerfile

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64) and load for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/php-source/preview.Dockerfile
          target: ${{ matrix.variant == 'fpm' && format('beta-fpm-{0}', matrix.tier) || format('beta-{0}', matrix.tier) }}
          platforms: linux/amd64
          cache-from: type=gha,scope=php86-${{ matrix.variant }}-${{ matrix.tier }}
          load: true
          tags: php86-beta:smoke
          build-args: |
            CACHE_REFRESH=${{ github.run_id }}

      - name: Smoke test + extension report
        run: |
          docker run --rm php86-beta:smoke sh -c '
            set -e
            php -v | head -1
            warn=$(php -r "exit(0);" 2>&1 | grep -c Warning || true)
            [ "$warn" = "0" ] || { echo "startup warnings: $warn"; php -r "exit(0);"; exit 1; }
            n=$(php -m | grep -cE "^(pdo_mysql|pdo_pgsql|mysqli|pgsql|zip|intl|bcmath|gd|exif|pcntl|sockets|bz2|gmp|mbstring)$")
            [ "$n" = "14" ] || { echo "expected 14 core extensions, got $n"; php -m; exit 1; }
            composer --version >/dev/null
            echo "SMOKE OK"'
          if [ '${{ matrix.variant }}' = 'fpm' ]; then
            docker run --rm php86-beta:smoke php-fpm -t
          fi
          {
            echo "## 8.6 extension report - ${{ matrix.tier }}"
            echo '```'
            docker run --rm php86-beta:smoke cat /usr/local/etc/php86-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push multi-arch beta tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/php-source/preview.Dockerfile
          target: ${{ matrix.variant == 'fpm' && format('beta-fpm-{0}', matrix.tier) || format('beta-{0}', matrix.tier) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=php86-${{ matrix.variant }}-${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=php86-${{ matrix.variant }}-${{ matrix.tier }}
          push: true
          tags: ghcr.io/${{ github.repository }}/php-${{ matrix.variant }}:8.6-rc-trixie${{ matrix.tag_suffix }}
          build-args: |
            CACHE_REFRESH=${{ github.run_id }}

  alert:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Ping the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 23 --repo "${{ github.repository }}" --body "The PHP 8.6 beta lane went red: upstream moved (new beta, pie change, or a core extension stopped compiling). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
