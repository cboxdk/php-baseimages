name: Build and Push Nginx Images

on:
  push:
    branches: [main, develop]
    paths:
      - 'nginx/**'
      - '.github/workflows/build-nginx.yml'
    tags:
      - 'nginx-*'
  pull_request:
    branches: [main]
    paths:
      - 'nginx/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nginx

jobs:
  build-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os_variant: ['bookworm']

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          echo "path=./nginx/Dockerfile" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT

      # Release channel tag (-vN): rebuilt weekly with security patches,
      # never crosses a tooling major. See docs/reference/tagging-strategy.md.
      - name: Resolve release channel
        id: channel
        run: |
          CHANNEL=$(jq -r '.release.channel // empty' versions.json)
          if [ -n "$CHANNEL" ]; then
            echo "suffix=-v${CHANNEL}" >> $GITHUB_OUTPUT
          else
            echo "suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.os_variant }}
            type=ref,event=pr,suffix=-${{ matrix.os_variant }}
            type=semver,pattern={{version}},suffix=-${{ matrix.os_variant }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.os_variant }}
            type=raw,value=${{ matrix.os_variant }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.os_variant }}${{ steps.channel.outputs.suffix }},enable=${{ steps.channel.outputs.suffix != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')) }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          # Both: this one builds directly rather than through
          # `_build-image.yml`, and an amd64-only image cannot run on Apple
          # silicon at all. QEMU on an amd64 runner is what made this slow;
          # buildx here still emulates, and nginx is small enough that it does
          # not matter — the PHP tiers, which are not, build natively per
          # architecture in `_build-image.yml`.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nginx-${{ matrix.os_variant }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.os_variant }}

      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name test-nginx -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.os_variant }}
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop test-nginx && docker rm test-nginx
