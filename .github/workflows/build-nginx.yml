name: Build and Push Nginx Images
run-name: Build Nginx security:${{ inputs.security_trigger || 'normal' }} OS:${{ inputs.os_revision || 'manual' }}

# One chain per ref at a time: two chains racing on the same branch is how
# the -v1 tags briefly carried an older build's content (a flake rerun
# finishing after the next push's chain). Queued, not cancelled - a running
# security rebuild must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, develop]
    paths:
      - 'nginx/**'
      - '.github/workflows/build-nginx.yml'
    tags:
      - 'nginx-*'
  pull_request:
    branches: [main]
    paths:
      - 'nginx/**'
  workflow_dispatch:
    inputs:
      os_revision:
        type: string
        default: ''
      security_trigger:
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nginx

jobs:
  build-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os_variant: ['trixie']

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Dockerfile path
        id: dockerfile
        run: |
          echo "path=./nginx/Dockerfile" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT

      # Release channel tag (-vN): rebuilt with security patches,
      # never crosses a tooling major. See docs/reference/tagging-strategy.md.
      - name: Resolve release channel
        id: channel
        run: |
          CHANNEL=$(jq -r '.release.channel // empty' versions.json)
          if [ -n "$CHANNEL" ]; then
            echo "suffix=-v${CHANNEL}" >> $GITHUB_OUTPUT
          else
            echo "suffix=" >> $GITHUB_OUTPUT
          fi
          echo "week=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.os_variant }}
            type=ref,event=pr,suffix=-${{ matrix.os_variant }}
            type=semver,pattern={{version}},suffix=-${{ matrix.os_variant }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.os_variant }}
            type=raw,value=${{ matrix.os_variant }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.os_variant }}${{ steps.channel.outputs.suffix }},enable=${{ steps.channel.outputs.suffix != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')) }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build immutable candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          # Both: this one builds directly rather than through
          # `_build-image.yml`, and an amd64-only image cannot run on Apple
          # silicon at all. QEMU on an amd64 runner is what made this slow;
          # buildx here still emulates, and nginx is small enough that it does
          # not matter — the PHP tiers, which are not, build natively per
          # architecture in `_build-image.yml`.
          platforms: linux/amd64,linux/arm64
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || '' }}
          provenance: mode=max
          sbom: true
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          # Every mitigation must refresh APT, including two fixes in one week.
          build-args: |
            CACHE_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=nginx-${{ matrix.os_variant }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.os_variant }}

      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        if: github.event_name != 'pull_request'
        with:
          version: v0.76.2
          cache: true

      - name: Gate both platforms before tags move
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
        run: |
          for arch in amd64 arm64; do
            trivy image --image-src remote --platform "linux/$arch" --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --ignorefile .trivyignore --exit-code 1 "$IMAGE"
            bash scripts/test-nginx-image.sh "$IMAGE" "linux/$arch"
          done

      - uses: sigstore/cosign-installer@v4.1.3
        if: github.event_name != 'pull_request'
      - name: Sign verified candidate index
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Promote verified digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          # A single existing multi-platform index is copied without changing its digest.
          docker buildx imagetools create "${args[@]}" "$IMAGE"
