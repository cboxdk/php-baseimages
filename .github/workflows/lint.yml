name: Lint

# Static analysis for shell scripts, Dockerfiles, and workflow YAML.
# Tool versions are pinned for reproducibility; bump them via Dependabot/PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck / hadolint / actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --- Shell scripts (fail on real bugs; style warnings are advisory) ---
      - name: ShellCheck
        run: |
          echo "Using $(shellcheck --version | grep version:)"
          # -S error: fail only on errors so the gate is stable; run at warning
          # locally (make/README) to see style suggestions.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -S error

      # --- Dockerfiles ---
      - name: hadolint
        env:
          HADOLINT_VERSION: "2.14.0"
        run: |
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x /tmp/hadolint
          rc=0
          for df in php-base/Dockerfile php-fpm/Dockerfile php-cli/Dockerfile php-fpm-nginx/Dockerfile nginx/Dockerfile; do
            echo "::group::hadolint $df"
            /tmp/hadolint --failure-threshold error "$df" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # --- GitHub Actions workflows ---
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # Ignore low-value shellcheck style hints in run: blocks (SC2086 et al.);
          # real workflow errors and unknown-label checks still gate.
          /tmp/actionlint -ignore 'SC2086' -ignore 'SC2129' -ignore 'SC2046'


      - name: Env contract check
        run: |
          # Every env var the docs promise must be consumed by the images -
          # both competitors shipped years of documented-but-dead envs
          # (webdevops#351, serversideup#594). External consumers live in
          # tests/env-contract-allowlist.txt with a named reason.
          chmod +x tests/test-env-contract.sh
          ./tests/test-env-contract.sh

      - name: Changelog drift check
        run: |
          # The repo-root CHANGELOG.md (what GitHub renders) must carry the
          # newest release section from docs/changelog.md (what cbox.dk
          # scrapes). They drifted apart once - the root file sat at a
          # pre-1.0 state while releases were stamped only in docs/.
          newest=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' docs/changelog.md)
          if [ -z "$newest" ]; then
            echo "::error::No release header found in docs/changelog.md"; exit 1
          fi
          if ! grep -qF "$newest" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the newest release section from docs/changelog.md: $newest"
            exit 1
          fi
          echo "CHANGELOG.md carries $newest - in sync"
