name: Build and Push PHP-Base Images
run-name: >-
  Build PHP base (${{ inputs.php_version || 'all' }}) OS:${{ inputs.os_revision || 'manual' }}

# One chain per ref at a time: two chains racing on the same branch is how
# the -v1 tags briefly carried an older build's content (a flake rerun
# finishing after the next push's chain). Queued, not cancelled - a running
# security rebuild must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, develop]
    paths:
      - 'php-base/**'
      - 'php-source/**'
      - 'scripts/php-source.py'
      - 'common/**'
      - 'versions.json'
      - '.trivyignore'
      - '.github/workflows/build-php-base.yml'
      - '.github/workflows/_build-image.yml'
    tags:
      - 'base-*'
  pull_request:
    branches: [main]
    paths:
      - 'php-base/**'
      - 'php-source/**'
      - 'scripts/php-source.py'
      - 'common/**'
      - 'versions.json'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      os_revision:
        description: 'Debian package-index revision from the hourly checker'
        type: string
        default: ''
      force_full:
        description: 'Recompile instead of patching the previous image'
        type: boolean
        default: false
      php_version:
        description: 'PHP Version to build (8.2, 8.3, 8.4, or all)'
        required: false
        default: 'all'
      os_variant:
        description: 'OS variant to build (trixie or all)'
        required: false
        default: 'all'
      tier:
        description: 'Image tier to build (slim, standard, chromium, or all)'
        required: false
        default: 'all'

# ═══════════════════════════════════════════════════════════════════════════════
# php-base uses build-args from versions.json and downloads cbox-init binaries.
# These are handled inside _build-image.yml (conditional on image-type=php-base).
#
# Tag pattern for php-base is simpler than downstream images:
#   - No PHP patch version tags
#   - No latest tags for non-standard tiers
#   - Uses semver tags on tag pushes
# ═══════════════════════════════════════════════════════════════════════════════

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # UPSTREAM PREFLIGHT - verify php:X-{cli,fpm}-trixie exists with BOTH archs
  # before any build starts. Upstream rollouts fill manifests in gradually
  # (docker-library/php#1645, #1683) and stable tags have lagged releases by
  # days (#1672); failing fast here leaves last week's good tags in place
  # instead of publishing a half-arch or mismatched release.
  # ═══════════════════════════════════════════════════════════════════════════
  upstream-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/check-upstream-manifest.sh
            scripts/php-source.py
            php-source/*.lock.json
            versions.json
          sparse-checkout-cone-mode: false
      - name: Check upstream manifests (amd64 + arm64)
        env:
          REQUESTED_PHP: ${{ inputs.php_version || 'all' }}
        run: |
          python3 scripts/php-source.py version
          chmod +x scripts/check-upstream-manifest.sh
          for v in $(jq -r '.php.supported[]' versions.json); do
            [ "$REQUESTED_PHP" != "all" ] && [ "$REQUESTED_PHP" != "$v" ] && continue
            if [ -f "php-source/php${v//./}-trixie.lock.json" ]; then
              python3 scripts/php-source.py --series "$v" version
              continue
            fi
            ./scripts/check-upstream-manifest.sh "$v" cli fpm
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # SLIM TIER - Minimal PHP with essential extensions only
  # ═══════════════════════════════════════════════════════════════════════════
  build-slim-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'slim' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: slim
      target: slim-root
      tag-suffix: slim
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing slim $IMAGE..."
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "opcache|redis|pdo_mysql|gd"
        docker run --rm $IMAGE composer --version
        # Slim does NOT have node or imagemagick - that's expected
    secrets: inherit

  build-slim-rootless-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'slim' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: slim
      target: slim-rootless
      rootless: true
      tag-suffix: slim-rootless
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing slim-rootless $IMAGE..."
        docker run --rm $IMAGE id -u | grep -E "^(33|82)$"
        docker run --rm $IMAGE php -v
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # STANDARD TIER (DEFAULT) - ImageMagick, Node.js included
  # ═══════════════════════════════════════════════════════════════════════════
  build-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'standard' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: standard
      target: root
      tag-suffix: ''
      cache-scope-prefix: base
      enable-cosign: true
      enable-latest-tag: true
      test-script: |
        echo "Testing $IMAGE..."
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "opcache|redis|pdo_mysql|gd|imagick"
        docker run --rm $IMAGE composer --version
        docker run --rm $IMAGE node --version
        docker run --rm $IMAGE bun --version
        docker run --rm $IMAGE cbox-init --version
    secrets: inherit

  build-rootless-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'standard' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: standard
      target: rootless
      rootless: true
      tag-suffix: rootless
      cache-scope-prefix: base
      enable-cosign: true
      enable-latest-tag: true
      test-script: |
        echo "Testing rootless image $IMAGE..."
        docker run --rm $IMAGE id -u | grep -E "^(33|82)$"
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "opcache|redis|pdo_mysql|gd|imagick"
        docker run --rm $IMAGE composer --version
        docker run --rm $IMAGE node --version
        docker run --rm $IMAGE bun --version
        docker run --rm $IMAGE cbox-init --version
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # CHROMIUM TIER - Includes Chromium for Browsershot/Dusk
  # ═══════════════════════════════════════════════════════════════════════════
  build-chromium-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: chromium
      target: chromium-root
      tag-suffix: chromium
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing chromium $IMAGE..."
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "opcache|redis|pdo_mysql|gd|imagick"
        docker run --rm $IMAGE composer --version
        docker run --rm $IMAGE node --version
        docker run --rm $IMAGE bun --version
        docker run --rm $IMAGE cbox-init --version
        # Verify Chromium is installed
        docker run --rm $IMAGE which chromium || docker run --rm $IMAGE which chromium-browser
    secrets: inherit

  build-chromium-rootless-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: chromium
      target: chromium-rootless
      rootless: true
      tag-suffix: chromium-rootless
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing chromium-rootless $IMAGE..."
        docker run --rm $IMAGE id -u | grep -E "^(33|82)$"
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE which chromium || docker run --rm $IMAGE which chromium-browser
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # DEV TIER - Standard + Xdebug, PCOV, SPX for development/testing
  # ═══════════════════════════════════════════════════════════════════════════
  build-dev-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: dev
      target: dev-root
      tag-suffix: dev
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing dev $IMAGE..."
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "opcache|redis|pdo_mysql|gd|imagick|xdebug|pcov|spx"
        docker run --rm $IMAGE composer --version
        docker run --rm $IMAGE node --version
        docker run --rm $IMAGE bun --version
        docker run --rm $IMAGE cbox-init --version
        # Verify Chromium is installed (inherited from chromium tier)
        docker run --rm $IMAGE which chromium || docker run --rm $IMAGE which chromium-browser
    secrets: inherit

  build-dev-rootless-matrix:
    needs: upstream-preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tier == 'all' || inputs.tier == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ (github.event_name == 'workflow_dispatch' && inputs.php_version != 'all') && fromJson(format('["{0}"]', inputs.php_version)) || fromJson('["8.2","8.3","8.4","8.5"]') }}
        os_variant: ${{ (github.event_name == 'workflow_dispatch' && inputs.os_variant != 'all') && fromJson(format('["{0}"]', inputs.os_variant)) || fromJson('["trixie"]') }}
    uses: ./.github/workflows/_build-image.yml
    with:
      force-full: ${{ inputs.force_full || github.event.client_payload.force_full || false }}
      image-name: php-base
      image-type: php-base
      php-version: ${{ matrix.php_version }}
      os-variant: ${{ matrix.os_variant }}
      tier: dev
      target: dev-rootless
      rootless: true
      tag-suffix: dev-rootless
      cache-scope-prefix: base
      enable-cosign: true
      test-script: |
        echo "Testing dev-rootless $IMAGE..."
        docker run --rm $IMAGE id -u | grep -E "^(33|82)$"
        docker run --rm $IMAGE php -v
        docker run --rm $IMAGE php -m | grep -E "xdebug|pcov|spx"
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # Trigger dependent image builds after php-base completes
  # ═══════════════════════════════════════════════════════════════════════════
  trigger-dependent-builds:
    needs: [build-slim-matrix, build-slim-rootless-matrix, build-matrix, build-rootless-matrix, build-chromium-matrix, build-chromium-rootless-matrix, build-dev-matrix, build-dev-rootless-matrix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Trigger dependent builds (php-fpm + php-cli)
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: php-base-updated
          client-payload: >-
            {"source_ref": "${{ github.sha }}", "php_version": "${{ inputs.php_version || 'all' }}", "force_full": ${{ inputs.force_full || false }}}
