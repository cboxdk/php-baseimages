            CBOX_PHP_EOL=${{ steps.lifecycle.outputs.PHP_EOL }}
            CBOX_REMOVAL_DATE=${{ steps.lifecycle.outputs.REMOVAL_DATE }}
            CBOX_PREVIEW_STATUS=${{ steps.lifecycle.outputs.PREVIEW_STATUS }}

