name: PR Dev Image

# Every PR gets a pullable test image, so a bug reporter can verify the fix
# on their own machine BEFORE it merges - the single practice that most
# visibly shortens the fix-confirm loop in comparable projects.
#
# Scope kept deliberately small: one image (php-fpm-nginx standard/root, the
# most-used artifact), default PHP, amd64 only. The full matrix still runs on
# main; this is a smoke-and-verify artifact, not a release.

on:
  pull_request:
    paths:
      - 'php-fpm-nginx/**'
      - 'php-fpm/**'
      - 'php-base/**'
      - 'common/**'
      - 'versions.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-dev-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs get no package-write token; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve default PHP version
        id: php
        run: echo "version=$(jq -r '.php.default' versions.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-fpm-nginx/Dockerfile
          target: root
          platforms: linux/amd64
          push: true
          build-args: |
            PHP_VERSION=${{ steps.php.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/dev:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=pr-dev
          cache-to: type=gha,scope=pr-dev,mode=max

      - name: Smoke test
        run: |
          IMG=ghcr.io/${{ github.repository }}/dev:pr-${{ github.event.pull_request.number }}
          docker pull -q "$IMG"
          docker run --rm "$IMG" php -v
          docker run --rm "$IMG" cbox-init --version

      - name: Summary
        run: |
          echo "### PR test image" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${{ github.repository }}/dev:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
