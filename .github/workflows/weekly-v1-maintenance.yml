name: Weekly v1 Maintenance Rebuild

# The support policy's other half: when a new major ships from main, the
# previous major keeps receiving weekly security rebuilds for 6 months, built
# from its release/vN branch (versions.json there still says channel "1", so
# the same build workflows tag -v1). GitHub only runs schedules on the
# default branch, so this dispatcher lives on main and points the build
# workflows at the maintenance branch.
#
# v1 maintenance window: until 2027-03-10 (six months after v2 shipped).
# When it closes: delete this workflow and drop "1" from
# versions.json release.supported_majors.

on:
  schedule:
    # Mondays 04:00 UTC - after main's own 03:00 rebuild wave, so the runners
    # serve the current major first.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for the EOL check)
        uses: actions/checkout@v7
        with:
          sparse-checkout: versions.json
          sparse-checkout-cone-mode: false

      - name: Stop dispatching after the maintenance window
        id: window
        run: |
          if [ "$(date -u +%F)" \> "2027-03-10" ]; then
            echo "v1 maintenance window closed (2027-03-10) - not dispatching. Delete this workflow and drop '1' from release.supported_majors."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch build chain on release/v1
        if: steps.window.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # php-base first; the downstream workflows on the branch chain off
          # the published base exactly as on main. Sequential dispatch with a
          # head start for base keeps the registry race window small.
          gh workflow run build-php-base.yml --ref release/v1
          sleep 60
          gh workflow run build-nginx.yml --ref release/v1
          gh workflow run build-php-fpm.yml --ref release/v1
          gh workflow run build-php-cli.yml --ref release/v1
          gh workflow run build-php-fpm-nginx.yml --ref release/v1
          echo "Dispatched the v1 chain on release/v1." >> "$GITHUB_STEP_SUMMARY"
