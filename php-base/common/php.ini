[PHP]
; ─────────────────────────────────────────────────────────────────────────────
; Cbox Base Image - PHP Configuration
; Single source of truth for all Cbox images
; ─────────────────────────────────────────────────────────────────────────────

; Memory & Execution
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Upload Limits
upload_max_filesize = 64M
post_max_size = 64M

; ─────────────────────────────────────────────────────────────────────────────
; Realpath Cache (CRITICAL: 20-30% performance improvement)
; ─────────────────────────────────────────────────────────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Error Handling
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Date & Time
date.timezone = UTC

; Session
session.save_handler = files
session.save_path = /tmp

; Session cookie hardening. Same trap as register_argc_argv below: official
; PHP docker images ship NO base ini, so the ENGINE defaults applied - and the
; engine defaults httponly and use_strict_mode to off, where php.ini-production
; turns them on. This image ships an ini, so the default is ours to own.
;
; Laravel sets all three itself from config/session.php, so Laravel apps were
; never exposed. The apps that were are the ones calling session_start()
; directly - plain PHP, WordPress, legacy code - where httponly=off means any
; XSS can read the session cookie, and use_strict_mode=off accepts a session id
; the attacker chose (fixation).
;
; cookie_secure stays unset on purpose: forcing it would break every local
; http:// development container. Set PHP_SESSION_COOKIE_SECURE=1 in production.
session.cookie_httponly = On
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
; Off is the php.ini-production default, but official docker images ship NO
; base ini, so the engine default (On) applied here. With On, a web request's
; query string becomes $argv in scripts that consult it - the CVE-2024-56145
; class of RCE. CLI is unaffected: the CLI SAPI always populates argv/argc.
register_argc_argv = Off

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 0

; Memory Configuration
;
; Sized against a MEASURED Laravel app, not a Symfony tuning guide. Rig: a
; Laravel 13 install with livewire, horizon, spatie/laravel-permission and
; sanctum, config/route/view cached, booted through the real HTTP kernel on
; php-cli:8.5-bookworm.
;
;   warm set, one real request : 633 scripts, 116.1 MB, 19.58 MB interned
;   every .php file compiled   : 10,020 scripts, 268.2 MB, 40.93 MB interned
;
; memory_consumption 256 leaves 2.2x headroom over the warm set; raising it
; would cost shared memory in every small container to buy nothing.
;
; max_accelerated_files 20000 covers even the compile-everything case at
; 10,020. Symfony's guide recommends 32531 and that number gets copied around
; the PHP world; for Laravel it is a 3x over-provisioned hash table.
;
; interned_strings_buffer was 16 and that was WRONG: a single warm request
; interns 19.58 MB, so the buffer overflowed on ordinary traffic and the
; strings past the ceiling fell back to per-process storage - paid for by
; every worker, silently, with no error anywhere. 32 covers the measurement
; with headroom without over-allocating for the small-container case.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Performance Tuning
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; File Cache (optional, for shared hosting)
;opcache.file_cache = /tmp/opcache

; JIT Configuration (PHP 8+)
opcache.jit = tracing
opcache.jit_buffer_size = 100M

[apcu]
; Enable APCu
apc.enabled = 1
apc.shm_size = 64M
apc.ttl = 7200
apc.gc_ttl = 3600
apc.enable_cli = 0

[redis]
; Redis Session Handler (use with: session.save_handler = redis)
; Enable persistent connections for better performance
redis.session.locking_enabled = 1
redis.session.lock_expire = 30
redis.session.lock_wait_time = 10000
redis.session.lock_retries = 10

; Connection pooling (reduces connection overhead)
; Format: tcp://host:port?persistent=1&database=0&auth=password
; Example: redis.session.save_path = "tcp://redis:6379?persistent=1"

; Cluster support (for Redis Cluster)
; redis.clusters.seeds = "redis-cluster:7000"
; redis.clusters.timeout = 2
; redis.clusters.read_timeout = 2
; redis.clusters.auth = ""
