services:
  # PHP-FPM Service (Debian Bookworm)
  php-fpm:
    build:
      context: .
      dockerfile: ./php-fpm/Dockerfile
      args:
        PHP_VERSION: "8.4"
    container_name: cbox-fpm
    volumes:
      - ./test-app:/var/www/html
    networks:
      - cbox-network

  # PHP-FPM Dev Service (Debian Bookworm with Xdebug)
  php-fpm-dev:
    build:
      context: .
      dockerfile: ./php-fpm/Dockerfile
      target: dev-root
      args:
        PHP_VERSION: "8.4"
    container_name: cbox-fpm-dev
    volumes:
      - ./test-app:/var/www/html
    networks:
      - cbox-network
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    profiles:
      - dev

  # PHP-CLI Service (Debian Bookworm)
  php-cli:
    build:
      context: .
      dockerfile: ./php-cli/Dockerfile
      args:
        PHP_VERSION: "8.4"
    container_name: cbox-cli
    volumes:
      - ./test-app:/var/www/html
    networks:
      - cbox-network
    command: tail -f /dev/null

  # Nginx Service (Debian Bookworm)
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: cbox-nginx
    ports:
      - "8080:80"
    volumes:
      - ./test-app:/var/www/html:ro
    networks:
      - cbox-network
    depends_on:
      - php-fpm

  # PHP-FPM + Nginx Multi-Service (Debian Bookworm)
  php-fpm-nginx:
    build:
      context: .
      dockerfile: ./php-fpm-nginx/Dockerfile
      args:
        PHP_VERSION: "8.4"
    container_name: cbox-fpm-nginx
    ports:
      - "8081:80"
    volumes:
      - ./test-app:/var/www/html
    networks:
      - cbox-network
    environment:
      - LARAVEL_SCHEDULER=true
      - LARAVEL_AUTO_OPTIMIZE=false
    profiles:
      - multi

networks:
  cbox-network:
    driver: bridge
